# HomeForge example config. Copy to `config.yaml` (gitignored) and edit for your home.
# IPs below are placeholders — replace with your own devices.

api:
  addr: ":8093"

database:
  driver: sqlite            # or "postgres"
  dsn: homeforge.db         # postgres: "postgres://user:pass@localhost/homeforge"

mqtt:
  external: false           # true = use an existing broker instead of the embedded one
  host: localhost
  port: 1883
  # username: ""
  # password: ""
  # Local Z-Wave door locks bridged in via zwave-js-ui (see internal/mqtt handleZwaveState).
  # `node` is the zwave-js-ui *named* topic segment — name the node in zwave-js-ui, spaces
  # become underscores. HomeForge creates lock.<id> and controls it locally (no cloud hub).
  # zwave_locks:
  #   - {node: "Front_Door", id: "front_door", name: "Front Door"}
  #   - {node: "Garage", id: "garage", name: "Garage"}

history:
  enabled: true             # long-term history in TimescaleDB (see docker-compose.yml)
  dsn: "postgres://homeforge:${POSTGRES_PASSWORD}@127.0.0.1:5433/homeforge"
  retention_raw: "30 days"

integrations:
  zigbee2mqtt:
    enabled: true
    base_topic: zigbee2mqtt

  esphome:
    enabled: false
    devices:
      - name: bedroom_light
        host: 192.168.1.50
        port: 6053

  wiz:
    enabled: false
    bulbs:
      - name: living_room
        ip: 192.168.1.60

  wled:
    enabled: false
    devices:
      - name: garage_strip
        host: 192.168.1.70

# ── Local AI assistant (optional; needs an ollama server — see README) ──
assistant:
  enabled: false
  model: qwen2.5:3b-instruct
  ollama_url: http://127.0.0.1:11435/api/chat
  num_ctx: 4096
  num_thread: 4
  num_gpu: 0                # 0 = CPU-only
  prewarm: true
  # whisper_url: http://127.0.0.1:9010   # speech-to-text (optional)
  # piper_url:   http://127.0.0.1:5111   # text-to-speech (optional)

# ── Login (strongly recommended if you expose HomeForge beyond your LAN) ──
auth:
  enabled: true
  owner_email: you@example.com   # pre-filled on first-run account setup
  session_days: 30
  # cookie_domain: ".example.com"   # only needed to share the session across subdomains

# ── Cameras (optional): embed an NVR (Sentinel/Frigate) under /nvr/ on this same domain,
#    behind the login. HomeForge reverse-proxies + path-rewrites it so it works over a tunnel. ──
cameras:
  nvr_upstream: http://localhost:5000

automations:
  - name: Hallway Motion Light
    trigger:
      type: state_change
      entity: binary_sensor.hallway_motion
      to: "on"
    action:
      - service: light.turn_on
        entity: light.hallway
      - wait: 300s
      - service: light.turn_off
        entity: light.hallway
